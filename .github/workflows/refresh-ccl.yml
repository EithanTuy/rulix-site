name: Generate regulatory snapshot review PR

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-regulatory-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run download:corpus
      - name: Detect official-source hash changes
        id: changes
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const current = JSON.parse(fs.readFileSync("corpus/manifest.generated.json", "utf8"));
          let previous = { sources: [] };
          try { previous = JSON.parse(fs.readFileSync("corpus/generated/manifest.json", "utf8")); } catch {}
          const hashes = (manifest) => (manifest.sources ?? [])
            .map((source) => `${source.id}:${source.rawByteHash ?? ""}`)
            .sort()
            .join("|");
          console.log(`changed=${hashes(current) !== hashes(previous)}`);
          NODE
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build:corpus-index
      - if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.changed == 'true'
        run: npx vitest run server/cclIndex.test.ts server/regulatory/corpus.test.ts
      - name: Open pending snapshot review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/regulatory-refresh-${GITHUB_RUN_ID}"
          git config user.name "rulix-corpus-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add corpus/manifest.generated.json corpus/raw corpus/generated/manifest.json corpus/generated/ccl-index.json server/data/ccl-index.generated.json src/data/ccl-metadata.generated.json
          git commit -m "chore(corpus): generate pending regulatory snapshot"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Review pending regulatory snapshot" --body "Automated primary-source refresh. Generated bytes and parser output remain pending_review. A qualified reviewer must inspect source changes, affected rules, parser regressions, and the exact manifest; create a review record matching corpus/corpus-review.schema.json; run npm run promote:corpus-index -- --review-record=corpus/reviews/<review>.json; and commit the reviewed artifacts plus activated server snapshot to this PR. The verified server snapshot activates only after merge; merging pending parser output alone does not approve it."
